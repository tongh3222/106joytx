name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取 cfnew 最新发布
        id: get_latest
        shell: bash
        run: |
          set -e

          echo "正在获取最新发布信息..."

          LATEST_RELEASE=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/byJoey/cfnew/releases/latest)

          VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name // empty')

          if [ -z "$VERSION" ]; then
            echo "错误：没有获取到版本号"
            echo "$LATEST_RELEASE"
            exit 1
          fi

          DOWNLOAD_URL=$(echo "$LATEST_RELEASE" | jq -r \
            '.assets[] | select(.name == "Pages.zip") | .browser_download_url' | head -1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "错误：没有找到 Pages.zip"
            echo "当前发布的文件："
            echo "$LATEST_RELEASE" | jq -r '.assets[].name'
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "file_name=Pages.zip" >> "$GITHUB_OUTPUT"

          echo "最新版本：$VERSION"
          echo "下载地址：$DOWNLOAD_URL"

      - name: 检查当前版本
        id: check_version
        shell: bash
        run: |
          if [ -f VERSION.txt ]; then
            CURRENT_VERSION=$(tr -d '\n\r ' < VERSION.txt)
          else
            CURRENT_VERSION=""
          fi

          NEW_VERSION="${{ steps.get_latest.outputs.version }}"

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "need_update=true" >> "$GITHUB_OUTPUT"
            echo "需要更新：$CURRENT_VERSION -> $NEW_VERSION"
          else
            echo "need_update=false" >> "$GITHUB_OUTPUT"
            echo "版本相同，无需更新"
          fi

      - name: 下载并更新文件
        if: steps.check_version.outputs.need_update == 'true'
        shell: bash
        run: |
          set -e

          DOWNLOAD_URL="${{ steps.get_latest.outputs.download_url }}"
          VERSION="${{ steps.get_latest.outputs.version }}"

          echo "正在下载 Pages.zip..."

          curl -fL --retry 3 -o Pages.zip "$DOWNLOAD_URL"

          echo "正在检查压缩包..."
          unzip -t Pages.zip

          echo "正在解压缩..."
          unzip -o Pages.zip -d .

          rm -f Pages.zip

          echo "$VERSION" > VERSION.txt

          echo "更新完成：$VERSION"

      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -A

          if git diff --staged --quiet; then
            echo "没有文件变更需要提交"
          else
            git commit -m "自动同步：更新到 cfnew ${{ steps.get_latest.outputs.version }}"
            git push
            echo "推送成功"
          fi

      - name: 输出摘要
        if: always()
        shell: bash
        run: |
          echo "## 同步结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- 最新版本：${{ steps.get_latest.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 当前版本：${{ steps.check_version.outputs.current_version }}" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
            echo "- 状态：已更新" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 状态：无需更新或尚未完成检查" >> "$GITHUB_STEP_SUMMARY"
          fi
```
